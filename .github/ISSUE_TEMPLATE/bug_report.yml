name: Bug report
description: Something is wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include private data or credentials. Use synthetic examples. Report vulnerabilities via SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior and related requirement IDs
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
  - type: input
    id: env
    attributes:
      label: Version, OS, browser
